/* Every plan in every other class, so a layout you drew once is here the moment it
   exists. Nothing has to be "saved" first, and the seating never travels: only the
   tables and chairs are copied. */
function elsewhere(){
  const out = [];
  (S.classes || []).forEach(c => {
    if (c.name === S.active) return;
    (c.layouts || []).forEach(l => {
      if (l.layout) out.push({cls: c.name, name: l.plan, seats: l.seats, layout: l.layout});
    });
  });
  return out;
}
function elsewhereHTML(){
  const list = elsewhere();
  if (!list.length) return '';
  return `<h3 class="mt">In your other classes</h3>`
    + list.map((l,i) => `<div class="crow">
        <div class="txt"><b>${esc(l.name)}</b><span>${esc(l.cls)} · ${l.seats} chairs</span></div>
        <button class="del" data-elsewhere="${i}">Use here</button></div>`).join('')
    + `<div class="note">Brings the tables and chairs into ${esc(S.active)} with nobody seated.
        The other class keeps its own layout exactly as it is.</div>`;
}
const countSeatsIn = L => !L ? 0 : (L.items||[]).filter(i=>i.type==='table')
  .reduce((n,it)=> n + ['top','bottom','left','right']
    .reduce((m,e)=> m + (parseInt((it.seats||{})[e],10)||0), 0), 0);

function uniquePlanName(base){
  base = String(base || 'Plan').trim() || 'Plan';
  const taken = new Set(plans().map(p => p.name));
  if (!taken.has(base)) return base;
  let i = 2; while (taken.has(base + ' (' + i + ')')) i++;
  return base + ' (' + i + ')';
}
function addPlan(name, layout){
  const p = {id:'p' + Date.now().toString(36), name: uniquePlanName(name),
             layout: layout ? JSON.parse(JSON.stringify(layout)) : null,
             seats:{}, note:''};
  plans().push(p);
  S.plan.current = p.id;
  sel = null; selItem = null; undoStack = [];
  const u = $('undo'); if (u) u.disabled = true;
  save(); paintSub(); render();
  return p;
}

function paintSub(){
  const many = plans().length > 1;
  $('sub').textContent = S.active + (many ? ' · ' + cur().name : '')
    + ' · ' + S.students.length + ' students';
  $('planBtn').textContent = many ? cur().name : 'Rooms';
}

/* One student's photograph. The picture is sent as it is and the helper makes it the size
   the rest of them are, so one card cannot carry a portrait ten times the weight of its
   neighbours. */
async function sendPhoto(id, file){
  const q = '?class=' + encodeURIComponent(S.active) + '&id=' + encodeURIComponent(id)
          + '&name=' + encodeURIComponent(file.name) + '&t=' + encodeURIComponent(TOKEN);
  try {
    return await fetch('/api/photo' + q, {method:'POST', body:file}).then(r => r.json());
  } catch(e){ return {error:String(e)}; }
}

/* Whoever is now in the class, after somebody has joined it or left it.

   The undo history goes with them. It is a record of where people sat in a class that no
   longer exists, and replaying it after a student has left puts that student back in a
   chair - a chair then held by somebody who is not on the roll, drawn as empty, with the
   count at the top disagreeing with the list on the right. */

  S.students = r.students; S.classes = r.classes;
  sel = null; selItem = null;
  undoStack.length = 0;
  const u = $('undo'); if (u) u.disabled = true;
  if (forgetLeavers()) save();
  paintSub(); render();
}

function wireDrop(id, kind){
  const el = $(id), inp = document.createElement('input');
  // Extensions alone make some file choosers grey out a perfectly good spreadsheet -
  // notably one iSAMS has named "export (1).xlsx" - so name the types as well.
  inp.type='file';
  inp.accept='.xlsx,.xls,.xlsm,application/vnd.ms-excel,'
           + 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,'
           + 'application/vnd.ms-excel.sheet.macroEnabled.12';
  inp.style.display='none'; el.appendChild(inp);
  el.onclick = () => inp.click();
  inp.onchange = () => inp.files[0] && send(inp.files[0]);
  el.ondragover = e => { e.preventDefault(); el.classList.add('over'); };
  el.ondragleave = () => el.classList.remove('over');
  el.ondrop = e => {
    e.preventDefault(); e.stopPropagation(); el.classList.remove('over');
    const dt = e.dataTransfer;
    /* Dragging straight out of the Downloads stack or a browser's download bar hands over
       a promise rather than the file itself. Ask the other way; and when even that comes
       back empty, macOS has still said *where* the file is, which is all the helper needs
       - it is on this Mac and can simply open it. That is what makes dropping work from
       anywhere rather than only out of a Finder window. */
    let f = dt.files && dt.files[0];
    if (!f && dt.items) for (const it of dt.items){
      if (it.kind === 'file'){ f = it.getAsFile(); if (f) break; }
    }
    if (f) return send(f);
    let where = '';
    for (const type of ['text/uri-list', 'public.file-url', 'text/plain', 'URL']){
      try { where = (dt.getData(type) || '').trim(); } catch (err) { where = ''; }
      if (/^file:\/\//i.test(where) || where.startsWith('/')) break;
      where = '';
    }
    if (where) return sendPath(where);
    el.querySelector('span').innerHTML = 'macOS did not say what was dropped. '
      + '<b>Click this box</b> and choose the file instead.';
  };
  // The same file, named by where it is rather than handed over as bytes.
  function sendPath(where){
    const name = decodeURIComponent(where.split('/').pop() || 'file');
    return send({name, __path: where});
  }

  async function send(file){
    el.classList.remove('done');
    const note = el.querySelector('span'); note.textContent = 'Reading ' + file.name + ' …';
    busy++; syncGo();
    let r; try {
      r = file.__path
        ? await api('/api/uploadpath', {method:'POST', wait:120000,
              body: JSON.stringify({kind, path: file.__path})})
        : await fetch('/api/upload?kind='+kind+'&name='+encodeURIComponent(file.name)+'&t='+encodeURIComponent(TOKEN),
                      {method:'POST', body:file}).then(x=>x.json());
    } catch(e){ r = {error:String(e)}; }
    busy--;
    // Say what actually went wrong. "Could not read that file" sent people hunting for a
    // problem with the file name when the reason was usually inside the spreadsheet.
    if (!r || !r.ok){
      note.textContent = 'Could not read ' + file.name + '.'
                       + ((r && r.error) ? ' ' + r.error : '');
      up[kind]=null; syncGo(); return;
    }
    if (kind !== 'badges' && (r.warning || r.students === undefined)){
      const why = (r.warning || '').trim();
      note.innerHTML = 'That spreadsheet has no Surname / Forename / Date of Birth columns.'
        + (why ? '<br><i style="font-size:11px">' + esc(why.split('\n').pop().slice(0,160)) + '</i>' : '');
      up[kind] = null; syncGo(); return;
    }
    up[kind] = r.path; el.classList.add('done');
    note.textContent = file.name + (r.students !== undefined ? ' · ' + r.students + ' students' : '')
      + ' · ' + (r.bytes > 900000 ? (r.bytes/1048576).toFixed(1)+' MB' : Math.round(r.bytes/1024)+' KB');
    syncGo();
  }
}
async function runImport(){
  const name = $('cname').value.trim();
  if (!name){ $('cname').focus(); return; }
  const log = $('ilog'); $('go').disabled = true; $('go').textContent='Adding…';
  log.style.display=''; log.textContent='Reading the files and cutting out the photographs…';
  // whichever list file arrived is the roster; the other one, if any, fills in the gaps
  const roster = up.report || up.extra;
  const extras = [up.report && up.extra ? up.extra : null].filter(Boolean);
  let r; try {
    r = await api('/api/import',{method:'POST',body:JSON.stringify(
      {name, report:roster, badges:up.badges, extras})});
  } catch(e){ r={error:String(e)}; }
  if (r && r.ok){ log.textContent = r.log.trim(); setTimeout(()=>location.reload(), 1000); }
  else { log.textContent = (r && (r.error||'')) + '\n' + ((r && r.log)||''); $('go').disabled=false; $('go').textContent='Try again'; }
}

async function runUpdate(){

  log.style.display = ''; log.textContent = 'Reading the files and looking for new students…';

  const extras = [up.report && up.extra ? up.extra : null].filter(Boolean);
  let r; try {
    r = await api('/api/updateclass', {method:'POST', wait:900000, body: JSON.stringify(
      {class:name, report:roster, badges:up.badges, extras})});
  } catch(e){ r = {error:String(e)}; }
  if (!r || !r.ok){
    log.textContent = ((r && r.error) || 'That did not work.') + '\n' + ((r && r.log) || '');
    $('go').disabled = false; $('go').textContent = 'Try again';
    return;
  }
  // Put the new students on the roll before the summary is read, so that shutting the
  // dialog any way at all - the button, Escape, the backdrop - leaves the same result.
  if (name === S.active) rosterChanged(r);
  else { S.classes = r.classes; paintSub(); }
  showUpdateResult(name, r);
}

/* ---------------------------------------------------------------- printing */
/* The sheet is laid out in millimetres against the paper the print job is actually
   given - the app tells the printer which paper and which way round, rather than
   hoping the two agree. See preparePrint and, on the native side, main.swift. */
const MM = 96/25.4;                            // CSS pixels in one millimetre
const PMARGIN = 10;                            // mm of margin, set on the print job too
/* Held back from the paper. Across the width a millimetre or two is all it takes: that is
   only there so a printer that calls A4 209.9mm wide cannot tip a sheet onto a second page.

   The foot of the paper is a different matter and needs a great deal more. Very few
   printers can put ink right down to the bottom edge - a good many inkjets cannot image
   the last 15mm of it - and whatever falls in that strip is simply not printed. The
   sheets used to end 14mm from the bottom, which is inside it. On an ordinary plan that
   went unnoticed, because there is white space down there anyway; in reading mode the
   grid is drawn to fill the sheet, so what sat in that strip was the last row of cards,
   and a row of students came out missing. */
const PSLACK = 2;                              // mm across the width
const PFOOT  = 20;                             // mm kept clear at the foot of the paper
const PGAP = 4;                                // mm between the plan and the list under it
const PLANSHARE = 0.42;                        // the least of a sheet the plan ever gives up
const MINLIST = 0.7;                           // and the most the list is ever shrunk by
const MINCOL = 62;                             // mm: narrower than this and a column stops reading
const MINROWS = 5;                             // and a column of fewer names than this looks broken
const LISTGAP = 6;                             // mm between them - matches .plistcols in the CSS

/* Which classes this printout covers. Kept with the print settings, so the same four
   classes are one click next week. Names that have since gone are dropped. */
function printClasses(){
  const here = new Set((S.classes||[]).map(c => c.name));
  const list = (pset().classes || []).filter(n => here.has(n));
  return list.length ? list : (S.active ? [S.active] : []);
}

        Their real name, in brackets underneath</label>
      <label class="tgl"><input type="checkbox" id="plb" ${C.labels?'checked':''} ${lock}> Labels</label>
      ${anyNew ? `<label class="tgl"><input type="checkbox" id="pnb" ${C.newb?'checked':''} ${lock}>
        The New badge, on students in their first year</label>` : ''}
    </div>
    ${C.labels || !(anyNew && C.newb) ? '' : `<div class="note" style="margin:7px 0 0">The
      labels are off, but the New badge is a switch of its own and is still on. Turn that
      off too for a sheet you could hand to the class.</div>`}
    <div style="margin:13px 0 0">
      <label style="display:block;font-size:11.5px;font-weight:700;letter-spacing:.07em;
        text-transform:uppercase;color:var(--ink-3);margin-bottom:5px">Which name</label>
      <select id="pnm" ${lock} style="width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px">
        <option value="preferred"${C.names!=='full'?' selected':''}>Preferred name</option>
        <option value="full"${C.names==='full'?' selected':''}>Real name</option>
      </select>
      ${nameEg ? `<div class="note" style="margin-top:5px">${esc(nameEg)}</div>` : ''}
    </div>
    <h3 class="mt">Also print</h3>
    <div class="toggles">
      ${C.labels
        ? `<label class="tgl"><input type="checkbox" id="pl" ${P.legend?'checked':''}> What the labels mean</label>`
        : `<div class="note" style="margin:0 0 7px">With the labels off there is nothing to
             explain, so the key is left out.</div>`}
      <label class="tgl"><input type="checkbox" id="pc" ${P.list?'checked':''}> A class list, with your notes, underneath the plan</label>
      <label class="tgl"><input type="checkbox" id="pm" ${P.mono?'checked':''}> Black and white, for annotating by hand</label>
    </div>
    ${many ? `<h3 class="mt">Which classes</h3>
    <div class="toggles" id="pcls">
      ${S.classes.map(c => `<label class="tgl"><input type="checkbox" data-cl="${esc(c.name)}"
        ${picked.includes(c.name)?'checked':''}> ${esc(c.name)}
        <span class="cap" style="font-size:11.5px">${c.seated} of ${c.students} seated</span></label>`).join('')}
    </div>
    <div style="display:flex;gap:8px;margin-top:9px">
      <button class="btn" id="pcAll" style="flex:1">Tick them all</button>
      <button class="btn" id="pcOne" style="flex:1">Just this class</button>
    </div>
    <div class="note">Every class ticked comes out with the settings above, one after the
      other in a single print job — you no longer have to open them one at a time. Each
      class keeps its own room, its own labels and its own notes.</div>` : ''}
    <button class="pbtn" id="doPrint">${printBtnLabel(picked)}</button>
    <button class="pbtn ghost2" id="pkids">Set it up for the students</button>
    <div class="note">These choices apply to the printout only — the plan on screen stays exactly
      as it is. The student's view carries over if you have it on.</div>`;
  const set = (k, v) => { pset()[k] = v; save(); };
  const again = () => { const y = $('mbody').scrollTop; showPrint(); $('mbody').scrollTop = y; };
  /* Several of these controls are only drawn some of the time - the ones that explain
     labels are not worth drawing when the labels are off - so every one of them is
     attached through here. Reaching straight for a control that was not drawn threw, and
     because that happened before the dialog was put on screen the whole of Print
     disappeared: the button did nothing at all, and went on doing nothing every time,
     because the setting that had caused it was saved with the class. */
  const on = (id, fn) => { const el = $(id); if (el) el.onchange = fn; };
  on('pph', e => set('photos',   e.target.checked?1:0));
  on('psn', e => set('surnames', e.target.checked?1:0));
  on('prn', e => { set('realname', e.target.checked?1:0); again(); });   // the example follows it
  on('plb', e => { set('labels', e.target.checked?1:0); again(); });   // the key follows it
  on('pnm', e => { set('names', e.target.value); again(); });
  on('pnb', e => set('newb', e.target.checked?1:0));
  on('pl',  e => set('legend', e.target.checked?1:0));
  on('pfol', e => { set('follow', e.target.checked?1:0); again(); });
  on('pbig', e => { set('big', e.target.checked?1:0); again(); });
  on('pc', e => set('list', e.target.checked?1:0));
  on('pm', e => set('mono', e.target.checked?1:0));
  on('psize', e => set('paper', e.target.value));
  // the classes this run covers; the one on screen is always printable, ticked or not
  const pickClasses = list => { set('classes', list); again(); };
  $('mbody').querySelectorAll('[data-cl]').forEach(el => el.onchange = () => {
    const on = [...$('mbody').querySelectorAll('[data-cl]')]
      .filter(x => x.checked).map(x => x.dataset.cl);
    pickClasses(on.length ? on : [S.active]);
  });
  if ($('pcAll')) $('pcAll').onclick = () => pickClasses(S.classes.map(c => c.name));
  if ($('pcOne')) $('pcOne').onclick = () => pickClasses([S.active]);
  // Faces and names, nothing else - the copy that goes on the wall or into their hands.
  // It asks for a sheet deliberately unlike the one on screen, so it stops following it.
  // While it still followed, everything set here was read straight back off the screen
  // and the button did nothing at all: you pressed it, the labels stayed on, and the
  // sheet you handed out still said which children were which.
  $('pkids').onclick = () => {
    const C = cardSettings(pset());          // keep the layout, drop what identifies them
    Object.assign(pset(), {follow:0, photos:1, surnames:1, names:'preferred',
                           big:C.big, realname:0, labels:0, newb:0, list:0});
    save(); again();
  };
  $('doPrint').onclick = () => { const o = $('pori').value; shutModal(); setTimeout(()=>doPrint(o), 120); };
  openModal();
}
const printBtnLabel = list => list.length > 1 ? 'Print ' + list.length + ' classes' : 'Print';

const PAPER = {A4:[297,210], A3:[420,297]};      // [long edge, short edge] in mm
/* The sheet in millimetres: the paper less the margins the print job is given, and a hair
   more - a printer that calls A4 209.9mm wide must not tip a sheet onto a second page. */
function sheetSize(paper, wide){
  const [long, short] = PAPER[paper === 'A3' ? 'A3' : 'A4'];
  return {w: (wide ? long : short) - 2*PMARGIN - PSLACK,
          h: (wide ? short : long) - PMARGIN - PFOOT};
}
// The key only earns its space when there are labels on the cards to explain.
const printLegend = P => !!(P.legend && P.labels);

/* One print job carries one paper size and one way round, so when the choice is left to
   the app it goes with whichever way leaves the tightest of the chosen plans the most
   room. Rough allowances - for the heading, and for the class list when it is sharing the
   sheet - are enough to choose between two options. */
function bestWayRound(jobs, paper, withList, big){
  const worst = wide => {
    const s = sheetSize(paper, wide);
    const usable = (s.h - 25) * (withList ? 0.55 : 1);
    return Math.min(...jobs.map(j => {
      const L = j.G[wide ? 'wide' : 'tall'];
      const k = Math.min(s.w * MM / L.w, usable * MM / L.h);
      // In reading mode a card is free to change shape, so the two ways round are not
      // told apart by how much of the sheet is filled - they are told apart by the size
      // of name each of them ends up with, which is the whole point of the mode.
      return big ? k * L.card.nm : k;
    }));
  };
  return worst(true) >= worst(false);
}

/* Draw another class without disturbing the one on screen. Everything that draws a card
   reads these globals, so they stand in for the length of the call and are put back
   afterwards - including the editing state, which has no business on a printout. */
function withClass(d, P, fn){
  const keep = {active:S.active, students:S.students, plan:S.plan,
                mode:printMode, editing, sel, selItem};
  S.active = d.name; S.students = d.students || []; S.plan = d.plan || {};
  printMode = P; editing = false; sel = null; selItem = null;
  try { return fn(); }
  finally {
    S.active = keep.active; S.students = keep.students; S.plan = keep.plan;
    printMode = keep.mode; editing = keep.editing; sel = keep.sel; selItem = keep.selItem;
  }
}

/* A class the printout needs. The one on screen is already here; the others are read
   from disk once and kept, since nothing can change them without reopening the page. */
const classCache = {};
async function classData(name){
  if (name === S.active) return {name, students:S.students, plan:S.plan};
  if (!classCache[name]){
    const r = await api('/api/class?name=' + encodeURIComponent(name)).catch(()=>null);
    if (!r || r.error) return null;
    classCache[name] = r;
  }
  return classCache[name];
}

function headHTML(P, flipped){
  const when = new Date().toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'});
  const nSeated = Object.values(seats()).filter(Boolean).length;
  return `<h2>${esc(S.active)}${plans().length>1 ? ' — ' + esc(cur().name) : ''}</h2>
    <div class="pmeta">${nSeated} of ${S.students.length} students seated · ${when}${
      flipped ? " · student's view" : ''}</div>
    ${cur().note ? `<div class="pnote">${esc(cur().note)}</div>` : ''}
    ${printLegend(P) ? `<div class="plegend">${tags().map(t=>
      `<span class="lg"><span class="dot" style="background:${esc(t.colour)}"></span>
       <b>${esc(t.short||t.label)}</b>&nbsp;${esc(t.label)}</span>`).join('')}</div>` : ''}`;
}

/* One class, one sheet: the plan at the top and, if it was asked for, the class list
   underneath it. Both are left at their natural size here - they are fitted to the paper
   once they have been laid out and their real heights are known, which is the only
   honest way to do it. */
function sheetHTML(P, s, flipped, L){
  // These go on the sheet's own room, beside the sizes they work with, so this sheet is
  // drawn to its own settings whatever the screen behind it happens to be set to.
  const plain = (P.photos?'':' nophoto') + (P.surnames?'':' nosur') + (P.big?' big':'');
  return `<section class="psheet" style="width:${(s.w * MM).toFixed(2)}px">
      <div class="phead">${headHTML(P, flipped)}</div>
      <div class="proom"><div class="roomscale"><div class="room${flipped?' flip':''}${plain}"
        style="width:${L.w}px;height:${L.h}px;${bigVars(L)}">${roomHTML(L)}</div></div></div>
      ${P.list ? `<div class="pbelow"><div class="pbelowin">${
        classListHTML(printLegend(P))}</div></div>` : ''}
    </section>`;
}

/* The list in as many columns as it takes to sit under the plan rather than run on to a
   page of its own. The rows are moved rather than redrawn, so the numbering and
   everything in them is exactly what was there before. */
function listColumns(inner, cols){
  const holder = inner.querySelector('.plistcols');
  let table = inner.querySelector('table.plist');
  if (holder){                                  // back to one table before splitting again
    table = holder.querySelector('table');
    const body = table.querySelector('tbody');
    holder.querySelectorAll('table').forEach((t, i) => {
      if (i) t.querySelectorAll('tbody tr').forEach(tr => body.appendChild(tr));
    });
    holder.replaceWith(table);
  }
  if (!table || cols < 2) return;
  const rows = [...table.querySelectorAll('tbody tr')];
  const per = Math.ceil(rows.length / cols);
  if (per < 2) return;
  const wrap = document.createElement('div');
  wrap.className = 'plistcols';
  table.replaceWith(wrap); wrap.appendChild(table);
  for (let c = 1; c < cols; c++){
    const t = table.cloneNode(false);
    t.appendChild(table.querySelector('thead').cloneNode(true));
    const tb = document.createElement('tbody');
    t.appendChild(tb);
    rows.slice(c*per, (c+1)*per).forEach(tr => tb.appendChild(tr));
    wrap.appendChild(t);
  }
}

/* Wait for the photographs. A sheet sent to the printer before its faces have arrived
   comes out with holes where the students should be. */
function photosReady(host){
  const imgs = [...host.querySelectorAll('img')].filter(i => !i.complete);
  if (!imgs.length) return Promise.resolve();
  return Promise.race([
    Promise.all(imgs.map(i => new Promise(done => { i.onload = i.onerror = done; }))),
    new Promise(done => setTimeout(done, 8000))
  ]);
}

async function preparePrint(ori){
  const P = pset(), names = printClasses();
  const C = cardSettings(P);
  const M = {photos:C.photos, surnames:C.surnames, labels:C.labels, names:C.names,
             legend:P.legend, list:P.list, big:C.big, realname:C.realname,
             // The New badge has a switch of its own and answers to it alone. It used to
             // be forced off whenever the labels were off, which meant a teacher could
             // turn the badge on, watch it appear on screen, and get a sheet without it -
             // a switch overruled by a different switch, silently.
             newb: C.newb};
  const flipped = $('room').classList.contains('flip');

  /* Roughly the sheet reading mode is aiming at: the paper less the heading, and less
     the class list when that is sharing the page. The exact fit is done further down off
     the real heights - this only has to be good enough to choose a shape for the cards
     and a way round for the paper, and it is worked out for both ways round because
     which of them gives the bigger name is not obvious until it has been. */
  const aim = wide => { const q = sheetSize(P.paper, wide);
                        return q.w / Math.max(40, (q.h - 25) * (P.list ? 0.55 : 1)); };

  const jobs = [];
  for (const n of names){
    const d = await classData(n);
    if (!d) continue;
    jobs.push({d, G: withClass(d, M, () => {
      fitRoom();
      if (!M.big){ const L = Object.assign({}, layout()); return {wide:L, tall:L}; }
      return {wide: bigGrid(aim(true)), tall: bigGrid(aim(false))};
    })});
  }
  if (!jobs.length) return null;

  const wide = ori === 'landscape' ? true : ori === 'portrait' ? false
             : bestWayRound(jobs, P.paper, !!P.list, M.big);
  const s = sheetSize(P.paper, wide);
  jobs.forEach(j => { j.L = j.G[wide ? 'wide' : 'tall']; });

  const host = $('psheets');
  host.className = P.mono ? 'mono' : '';
  host.innerHTML = jobs.map(j => withClass(j.d, M, () => sheetHTML(M, s, flipped, j.L))).join('');
  fitNames(host);

  // Now everything is on the page and has a height, share what is left of each sheet
  // between the plan and the list under it. Nothing is guessed and nothing is scaled twice.
  host.querySelectorAll('.psheet').forEach(el => {
    const proom = el.querySelector('.proom'); if (!proom) return;
    proom.style.overflow = 'visible';
    const room = proom.querySelector('.room');
    const L = {w: parseFloat(room.style.width), h: parseFloat(room.style.height)};
    // where the plan actually starts, margins and all, rather than the heading's own height
    const top = proom.getBoundingClientRect().top - el.getBoundingClientRect().top;
    const space = Math.max(20, s.h - top / MM);          // all that is left below the heading
    const below = el.querySelector('.pbelow'), inner = below && below.querySelector('.pbelowin');
    const tall = () => inner.getBoundingClientRect().height / MM + PGAP;

    /* A list taking more than its share is put into columns rather than allowed to push
       the plan off the sheet. How many is not worth guessing from the width of the paper:
       it depends on what is in the table, and a column too narrow for its contents wraps
       the rows and comes out taller than it started - which is exactly what a guess used
       to get wrong. So each one is tried and kept only while it genuinely helps. */
    let listMM = 0;
    if (inner){
      listColumns(inner, 1);
      const names = inner.querySelectorAll('table.plist tbody tr').length;
      let best = 1, bestMM = tall();
      // Always worth trying. It used to try only once the list had already taken more
      // than its share of the sheet, which meant a list sitting just under that line
      // stayed in one tall column and the plan went short for no reason at all.
      const roomFor = cols => (s.w - (cols - 1) * LISTGAP) / cols >= MINCOL;
      for (let cols = 2; cols <= 4 && roomFor(cols) && names / cols >= MINROWS; cols++){
        listColumns(inner, cols);
        const h = tall();
        if (h >= bestMM - 0.5) break;            // no shorter: that is as far as it goes
        best = cols; bestMM = h;
      }
      listColumns(inner, best);
      listMM = tall();
    }

    // The plan keeps at least its share of the sheet however long the list is, and gets
    // more when the list is short. A list that will not fit in what is left is shrunk,
    // down to the point where it is still comfortably readable and no further.
    const avail = Math.max(space * PLANSHARE, space - listMM);
    const scale = Math.max(0.05, Math.min(s.w * MM / L.w, avail * MM / L.h, 1.6));
    const roomMM = Math.min(avail, L.h * scale / MM);    // a wide plan needs less than it may have
    proom.style.height = (roomMM * MM) + 'px';   // px, like the room it holds
    const sc = proom.querySelector('.roomscale');
    sc.style.width = (L.w * scale) + 'px'; sc.style.height = (L.h * scale) + 'px';
    room.style.transformOrigin = 'top left';
    room.style.transform = 'scale(' + scale + ')' +
      (flipped ? ' translate(' + L.w + 'px,' + L.h + 'px) rotate(180deg)' : '');

    if (!inner) return;
    const forList = space - roomMM;
    const k = listMM <= forList ? 1 : Math.max(MINLIST, forList / listMM);
    if (k < 1){
      inner.style.transform = 'scale(' + k + ')';
      inner.style.width = (100 / k) + '%';               // so it still fills the sheet across
    }
    // Held to its share only when it really does fit; a list too long for any one sheet
    // runs on to the next rather than being quietly cut off at the bottom.
    if (listMM * k <= forList + 0.5){ below.style.height = (forList * MM) + 'px'; }
    else { below.style.overflow = 'visible'; }
  });

  // Belt and braces for a browser: the app tells the printer the paper itself.
  let st = $('pgstyle');
  if (!st){ st = document.createElement('style'); st.id = 'pgstyle'; document.head.appendChild(st); }
  st.textContent = '@media print{@page{size:' + (P.paper === 'A3' ? 'A3 ' : 'A4 ')
    + (wide ? 'landscape' : 'portrait') + ';margin:' + PMARGIN + 'mm}}';

  await photosReady(host);
  return {paper: P.paper === 'A3' ? 'A3' : 'A4', wide, sheets: jobs.length};
}

/* Hand the sheets to the printer, and leave them alone until it has finished with them.
   The job is rendered when the print panel closes, not when it opens, so anything that
   redraws the page in between is printed instead of what the preview showed - which is
   why nothing here touches the page until afterprint comes back. */
function nativePrint(job){
  const mh = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.appwindow;
  if (mh){
    try {
      mh.postMessage(JSON.stringify({cmd:'print', paper:job.paper,
                                     landscape:!!job.wide, marginMM:PMARGIN}));
      return;
    } catch(e){ /* fall through to the browser's own */ }
  }
  window.print();
}

let printGuard = null;
/* Laying the sheets out has to finish before anything can be sent, but it must never be
   able to not finish: a class read from the helper, a photograph that never arrives, and
   the press is simply lost with nothing on screen to say why. */
const PREPWAIT = 45000;
async function doPrint(ori){
  if (printing){ flash('That printout is still being laid out — one moment.'); return; }
  printing = true;

  // The way out is set up before the first thing that can go wrong, not after it. It used
  // to be set after the sheets were laid out, so a lay-out that never finished left Print
  // switched off for the rest of the session with no message and nothing to try.
  const done = () => {
    if (!printing) return;
    printing = false;
    removeEventListener('afterprint', done);
    clearTimeout(printGuard);
    $('psheets').innerHTML = '';              // the sheets have done their job
  };
  addEventListener('afterprint', done);
  printGuard = setTimeout(done, 15 * 60 * 1000);

  let job = null;
  try {
    job = await Promise.race([preparePrint(ori),
      new Promise((_, no) => setTimeout(() => no(new Error('it took too long to lay out')),
                                        PREPWAIT))]);
  }
  catch(e){ done(); flash('That would not print: ' + (e && e.message ? e.message : e)); return; }
  if (!job){ done(); flash('There was nothing to print.'); return; }

  setTimeout(() => nativePrint(job), 60);
}
/* File ▸ Print and ⌘P come here rather than printing whatever is on screen. Always
   answered, even when there is nothing to print - falling through would hand the printer
   a page with the sheets not built yet, which is a blank one. */
window.appPrintDialog = () => {
  if (editing) flash('Finish with the room first — Done, then Print.');
  else if (!S.active) flash('There is no class to print yet.');
  else showPrint();
  return true;
};
/* The list that goes under the plan. The key is left out when the heading at the top of
   the same sheet is already carrying one. */
function classListHTML(headHasLegend){
  const where = {}; for (const k in seats()) if (seats()[k]) where[seats()[k]] = k;
  const rows = S.students.slice().sort((a,b)=>(a.surname+a.first).localeCompare(b.surname+b.first));
  const used = headHasLegend ? [] : tags().filter(t => Object.values(marks()).some(m => m.includes(t.id)));
  const away = pairs().map(([a,b]) => [byId(a), byId(b)]).filter(([a,b]) => a && b);
  /* Names and labels, and your own notes where you have written any. Everything that
     used to be in here as well - a running number, the register name, the form, a tick
     to say they have a seat - is either already on their card or already in the heading,
     and all it did here was make the table too wide to stand in columns. That width was
     the whole problem: one tall column of it took over half the sheet and left the plan
     with what was over. Narrow enough to double up, it takes a quarter of that, and the
     names can be big enough to find someone at a glance. */
  const anyNote = rows.some(s => (notes()[s.id] || '').trim());
  return `<h3>${esc(S.active)} — class list</h3>
    ${used.length ? `<div class="plegend" style="margin:0 0 6px">${used.map(t=>
      `<span class="lg"><span class="dot" style="background:${esc(t.colour)}"></span>
       <b>${esc(t.short||t.label)}</b>&nbsp;${esc(t.label)}</span>`).join('')}</div>` : ''}
    <table class="plist tight"><thead><tr><th>Name</th><th>Labels</th>
      ${anyNote ? '<th>Notes</th>' : ''}</tr></thead><tbody>
    ${rows.map(s=>`<tr><td class="who"><b>${esc(s.surname)}</b>, ${esc(s.first)}${
        where[s.id] ? '' : ' <span class="noseat">no seat</span>'}</td>
      <td>${(marks()[s.id]||[]).map(tagById).filter(Boolean)
             .map(t=>`<span class="tg" style="${chipStyle(t.colour)}">${esc(t.short||t.label)}</span>`).join(' ')}</td>
      ${anyNote ? `<td>${esc(notes()[s.id]||'')}</td>` : ''}</tr>`).join('')}
    </tbody></table>
    ${away.length ? `<div style="margin-top:10px;font-size:11.5px;line-height:1.7">
      <b style="font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#666">Keep apart</b><br>
      ${away.map(([a,b])=>esc(a.name)+' &nbsp;·&nbsp; '+esc(b.name)).join('<br>')}</div>` : ''}`;
}

                               zoom = Math.max(.25, zoom - .1); applyZoom(zoom); };
addEventListener('resize', () => {
  if (bigOn()) render();            // the cards are shaped to the window, so they follow it
  else if (autoFit) applyZoom();
});
$('flip').onclick    = () => {
  const on = $('room').classList.toggle('flip');
  $('flip').setAttribute('aria-pressed', on);
  $('flip').textContent = on ? "Teacher's view" : "Student's view";
  applyZoom(autoFit ? null : zoom);
};
/* Reading mode is a way of looking at the plan, like the student's view, so it lives
   next to it and is remembered with everything else about this class.

   The button keeps its name whichever way it is set, the way Fit does. Renaming it to
   "Show the room" while it was on was worse than saying nothing: the two names are not
   obviously opposites, so it read as some other thing this button now did rather than as
   the way back, and the way back looked as though it was missing. Lit up means on. */
function paintBig(){
  const on = !!show().big;
  $('big').setAttribute('aria-pressed', on);
  $('big').title = on ? 'Big names is on — click to put the room back'
                      : 'Leave the tables out and make the names as large as they will go';
}
$('big').onclick = () => { show().big = show().big ? 0 : 1; save(); paintBig(); render(); };
$('editRoom').onclick = () => {
  editing = !editing; sel = null; selItem = null;
  $('editRoom').textContent = editing ? 'Done' : 'Edit the room';
  $('editRoom').classList.toggle('primary', !editing);
  ['shuffle','alpha','alt','clear','flip','big','print','labels','undo','addStudent']
    .forEach(i => $(i).disabled = editing);
  if (!editing){ $('undo').disabled = !undoStack.length; $('alt').disabled = !altOK; }
  render();
};

/* ------------------------------------------------------------------ boot */
/* Students who have left the class since the last import are still named in the old plan.
   Forget them, so a departed student cannot hold a chair nobody can sit in. */
function forgetLeavers(){
  const here = new Set(S.students.map(s => s.id));
  let changed = false;
  for (const p of plans())
    for (const k in (p.seats||{}))
      if (p.seats[k] && !here.has(p.seats[k])){ delete p.seats[k]; changed = true; }
  for (const k in marks()) if (!here.has(k)){ delete marks()[k]; changed = true; }
  for (const k in pins())  if (!here.has(k)){ delete pins()[k];  changed = true; }
  for (const k in notes()) if (!here.has(k)){ delete notes()[k]; changed = true; }
  const keep = pairs().filter(([a,b]) => here.has(a) && here.has(b));
  if (keep.length !== pairs().length){ S.plan.pairs = keep; changed = true; }
  return changed;
}

async function boot(){
  S = await api('/api/state');
  if (!S.active){
    $('sub').textContent = 'No class yet';
    $('wrap').innerHTML =
      `<div class="empty2"><h3>No class yet</h3>
        <p>Add one from the <b>Classes</b> button and it will pull the students,
        their photographs and their preferred names straight out of your iSAMS exports.</p></div>`;
    $('bar').style.display = 'none';
    setTimeout(showImport, 300);
    return;
  }
  if (!cur().layout){
    /* A first room you can recognise: the board and screen at the front with the teacher's
       desk beside them, the door at the back, and six benches of four. 24 chairs seats a
       normal class with a few spare. Two long tables either side of the TV, which this used
       to be, is not a room anybody teaches in. Drag anything; Edit the room changes it all. */
    cur().layout = {name:'Room', w:1052, h:990, items:[
      {id:'t1', type:'table', x:94, y:278, seats:{top:2,bottom:2,left:0,right:0}, label:'Bench 1'},
      {id:'t2', type:'table', x:422, y:278, seats:{top:2,bottom:2,left:0,right:0}, label:'Bench 2'},
      {id:'t3', type:'table', x:750, y:278, seats:{top:2,bottom:2,left:0,right:0}, label:'Bench 3'},
      {id:'t4', type:'table', x:94, y:706, seats:{top:2,bottom:2,left:0,right:0}, label:'Bench 4'},
      {id:'t5', type:'table', x:422, y:706, seats:{top:2,bottom:2,left:0,right:0}, label:'Bench 5'},
      {id:'t6', type:'table', x:750, y:706, seats:{top:2,bottom:2,left:0,right:0}, label:'Bench 6'},
      {id:'m_board', type:'marker', shape:'board', label:'Whiteboard', x:94, y:40, w:430, h:26},
      {id:'m_tv', type:'marker', shape:'tv', label:'Screen', x:788, y:32, w:170, h:74},
      {id:'m_desk', type:'marker', shape:'desk', label:'Teacher', x:94, y:90, w:190, h:62},
      {id:'m_door', type:'marker', shape:'door', label:'Door', x:28, y:816, w:26, h:120}
    ]};
    save();
  }
  if (forgetLeavers()) save();
  paintSub();
  altOK = S.students.some(s => s.gender === 'M') && S.students.some(s => s.gender === 'F');
  if (!altOK){
    $('alt').disabled = true;
    $('alt').title = 'This class is single sex, or the import carried no gender, so there is nothing to alternate.';
  }
  paintBig();
  render();
}

/* The helper stops on its own once this window has gone, and a check-in every minute is
   how it knows the window is still here. A timer alone is not enough to promise that:
   macOS slows timers right down in a window that is behind everything else, and stops
   them altogether while the Mac is asleep. So the page also checks in the moment it is
   looked at again, which is exactly when a lid has just been opened. */
/* Anywhere but on one of the boxes, a dropped file is simply refused. Left to itself the
   window would navigate to it - the plan replaced by a spreadsheet, and no way back. */
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop',     e => e.preventDefault());

function beat(){ api('/api/heartbeat', {method:'POST', wait:8000}).catch(()=>{}); }
setInterval(beat, 45000);
addEventListener('focus', beat);
addEventListener('pageshow', beat);
document.addEventListener('visibilitychange', () => { if (!document.hidden) beat(); });
boot();
</script>
